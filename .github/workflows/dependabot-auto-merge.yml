name: Dependabot auto-merge

on:
  workflow_call:

permissions: {}

jobs:
  auto-merge:
    if: >-
      github.event_name == 'pull_request' &&
      github.actor == 'dependabot[bot]' &&
      github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      checks: read
      contents: write
      pull-requests: write
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Wait for portal validation checks
        if: >-
          (
            steps.metadata.outputs.update-type == 'version-update:semver-patch' ||
            steps.metadata.outputs.update-type == 'version-update:semver-minor'
          ) &&
          steps.metadata.outputs.package-ecosystem != 'github_actions'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          for check_name in "code-quality" "typecheck" "tests / tests"; do
            check_passed=false

            for attempt in $(seq 1 180); do
              check_runs=$(gh api "repos/${REPOSITORY}/commits/${HEAD_SHA}/check-runs?per_page=100")
              check_status=$(jq -r --arg name "$check_name" '
                [.check_runs[] | select(.name == $name)]
                | sort_by(.started_at // .created_at)
                | if length == 0 then "pending"
                  else
                    last
                    | if .status != "completed" then "pending"
                      elif .conclusion == "success" then "success"
                      else "failure:\(.conclusion)"
                      end
                  end
              ' <<< "$check_runs")

              if [[ "$check_status" == "success" ]]; then
                echo "$check_name passed."
                check_passed=true
                break
              fi

              if [[ "$check_status" == failure:* ]]; then
                echo "$check_name did not pass: $check_status" >&2
                exit 1
              fi

              sleep 10
            done

            if [[ "$check_passed" != "true" ]]; then
              echo "Timed out waiting for $check_name." >&2
              exit 1
            fi
          done

          current_head_sha=$(gh api "repos/${REPOSITORY}/pulls/${PR_NUMBER}" --jq '.head.sha')
          if [[ "$current_head_sha" != "$HEAD_SHA" ]]; then
            echo "The Dependabot branch changed while checks were running; refusing to enable auto-merge for stale results." >&2
            exit 1
          fi

      - name: Enable auto-merge for checked patch and minor updates
        if: >-
          (
            steps.metadata.outputs.update-type == 'version-update:semver-patch' ||
            steps.metadata.outputs.update-type == 'version-update:semver-minor'
          ) &&
          steps.metadata.outputs.package-ecosystem != 'github_actions'
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr merge --auto --squash "$PR_URL"
